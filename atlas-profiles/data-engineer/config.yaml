# ATLAS profile data-engineer (cheap tier). The model is written per tier by
# deploy/hermes/bootstrap.py from deploy/hermes/models.yaml. Host-wide pins
# (Docker network, approvals, disabled toolsets) come from Managed Scope:
# deploy/hermes/managed/config.yaml.
# MCP servers (H2) come from roster.yaml; ${...} values are filled from the
# profile's .env, which bootstrap.py writes with one scoped API token per server.
terminal:
  backend: docker
  docker_network: true
  container_persistent: true
  container_cpu: 1
  container_memory: 4096
  docker_mount_cwd_to_workspace: true
approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  single_query_mode: deny
  deny:
  - '*config/risk*'
  - '*prop_rules*'
  - '*config/strategies*'
platform_toolsets:
  cli:
  - terminal
  - file
  - code_execution
  - skills
  - memory
  - session_search
  - todo
  - atlas-market
  cron:
  - terminal
  - file
  - code_execution
  - skills
  - memory
  - session_search
  - todo
  - atlas-market
kanban:
  dispatch_in_gateway: false
  notify_in_gateway: false
mcp_servers:
  atlas-market:
    command: ${ATLAS_MCP_PYTHON}
    args:
    - -m
    - atlas_mcp
    - atlas-market
    env:
      ATLAS_API_URL: ${ATLAS_API_URL}
      ATLAS_ENGINE_TOKEN: ${ATLAS_TOKEN_MARKET}
    timeout: 120
    tools:
      include:
      - collect_market_state
      - get_bars
      - get_spread_stats
      resources: false
      prompts: false
tools:
  tool_search:
    enabled: 'off'
