# ATLAS profile distribution. `description` is also this profile's Kanban routing
# description: deploy/hermes/bootstrap.py applies it with `hermes profile describe`.
name: operations-monitor
version: 0.1.0
description: 'Operations triage: system health, alerts, reconciliation mismatches and incidents. May only
  ever disable new trading; escalates everything else to the human operator.'
hermes_requires: '>=0.21.4'
author: ATLAS
license: UNLICENSED
env_requires:
- name: TELEGRAM_BOT_TOKEN
  description: Telegram bot token for this profile's bot (one bot per profile)
  required: true
- name: TELEGRAM_ALLOWED_USERS
  description: The operator's numeric Telegram user id. The only user this bot answers.
  required: true
- name: TELEGRAM_HOME_CHANNEL
  description: Chat id of the operator's ATLAS Operations group. The cron health check, alert relay and
    reconciliation report deliver there.
  required: true
