[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS trading core: market data, shared features, setups and the T0 research backtester"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas-research = "atlas_research.cli:main"

[tool.setuptools.packages.find]
include = ["atlas_engine*", "atlas_research*"]

[tool.setuptools.package-data]
atlas_research = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
