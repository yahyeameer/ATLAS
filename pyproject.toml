[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS trading core: market data, shared features, setups, the T0 research backtester, the risk engine and prop rules, the research API and MCP servers, and the operations plugins"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Same pin as the Hermes mcp extra (vendor/hermes-agent/pyproject.toml).
mcp = ["mcp==2.0.0"]
dev = ["pytest>=8", "mcp==2.0.0"]

[project.scripts]
atlas-research = "atlas_research.cli:main"
atlas-api = "atlas_api.http:main"
atlas-mcp-market = "atlas_mcp.servers:main_market"
atlas-mcp-backtest = "atlas_mcp.servers:main_backtest"
atlas-mcp-journal = "atlas_mcp.servers:main_journal"
atlas-mcp-performance = "atlas_mcp.servers:main_performance"
atlas-mcp-operations = "atlas_mcp.servers:main_operations"
atlas-engine-sim = "atlas_api.ops:main"

[tool.setuptools.packages.find]
include = ["atlas_engine*", "atlas_research*", "atlas_api*", "atlas_mcp*", "atlas_plugins*"]

[tool.setuptools.package-data]
atlas_research = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
