# Allowlisting forward proxy for ATLAS agent sandboxes (H0 gap G3).
# Sandboxes sit on the internal Docker network `atlas-agents`, which has no
# route out; this proxy is their only exit. Model calls, web search and
# Telegram run in the Hermes processes on the host, not in sandboxes, so none
# of those hosts belong here.

http_port 3128

# Python packages for engineering cards.
acl allowed dstdomain pypi.org files.pythonhosted.org
# Git over HTTPS for worktree fetches.
acl allowed dstdomain github.com codeload.github.com objects.githubusercontent.com
# Market data for data-engineer cards (PRD §22).
acl allowed dstdomain datafeed.dukascopy.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all

# No caching, no identifying headers.
cache deny all
forwarded_for delete
via off
access_log stdio:/dev/stdout
